worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location /a1/ {
            try_files $uri $uri/ /a1/index.html;
        }

        location /a2/ {
            try_files $uri $uri/ /a2/index.html;
        }
    }
}
