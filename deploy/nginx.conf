worker_processes 1;

events {
    # Keeps the public nginx container lightweight while still supporting normal classroom traffic.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        # The university proxy forwards public HTTPS traffic to this container over plain HTTP on port 80.
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            # Serve the landing page that links to all assignments.
            try_files /index.html =404;
        }

        location /a1/ {
            # Serve Assignment 1 as static files directly from the public nginx container.
            try_files $uri $uri/ /a1/index.html;
        }

        location /a2/ {
            # Serve Assignment 2 as static files directly from the public nginx container.
            try_files $uri $uri/ /a2/index.html;
        }

        location /a4/ {
            # Strip the external /a4 prefix before forwarding the request to the dedicated Vue container.
            rewrite ^/a4/?(.*)$ /$1 break;
            # Proxy Assignment 4 to the separate internal container defined in docker-compose.
            proxy_pass http://a4:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
