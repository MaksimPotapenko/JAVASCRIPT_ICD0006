<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mpotap JavaScript Assignments</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --panel: #fffdf8;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #b44d12;
      --accent-dark: #7c2d12;
      --border: #e6d5bf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(180, 77, 18, 0.14), transparent 30%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(31, 41, 51, 0.1);
      border-color: #d6b38d;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .title {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    .path {
      margin: 0;
      font-family: "Courier New", monospace;
      color: var(--accent-dark);
    }
  </style>
</head>
<body>
  <main>
    <h1>JavaScript Coursework Deployments</h1>
    <p>
      This container serves both coursework projects from a single nginx instance for CI/CD deployment on the course VPS.
    </p>
    <div class="grid">
      <a class="card" href="/a1/">
        <div class="eyebrow">Assignment 1</div>
        <h2 class="title">Vanilla JavaScript Task Manager</h2>
        <p class="path">/a1/</p>
      </a>
      <a class="card" href="/a2/">
        <div class="eyebrow">Assignment 2</div>
        <h2 class="title">TypeScript Task Manager</h2>
        <p class="path">/a2/</p>
      </a>
    </div>
  </main>
</body>
</html>
